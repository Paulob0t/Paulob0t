<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="200">
  <defs>
    <pattern id="dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1.5" height="1.5" fill="#2b3548" opacity="0.65" />
    </pattern>
  </defs>

  <!-- Base Obsidian Window -->
  <rect x="2" y="2" width="996" height="196" fill="#0b0d11" stroke="#2b3548" stroke-width="4" />
  <rect x="4" y="38" width="992" height="158" fill="url(#dots)" />

  <!-- Top Tiling WM Window Bar -->
  <rect x="4" y="4" width="992" height="34" fill="#181d29" />
  <line x1="2" y1="38" x2="998" y2="38" stroke="#2b3548" stroke-width="2" />

  <!-- Window Controls (Square Pixel Dots) -->
  <rect x="18" y="15" width="12" height="12" fill="#ff5f56" />
  <rect x="36" y="15" width="12" height="12" fill="#ffbd2e" />
  <rect x="54" y="15" width="12" height="12" fill="#27c93f" />

  <!-- Window Title -->
  <text x="500" y="25" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="13" font-weight="700" fill="#8b96a8" text-anchor="middle" letter-spacing="1">
    paulobot@arch-hyprland: ~/wicode/architecture (zsh)
  </text>

  <!-- Right Status Indicator -->
  <rect x="885" y="10" width="96" height="22" fill="#0b0d11" stroke="#00f59b" stroke-width="1.5" />
  <rect x="895" y="17" width="8" height="8" fill="#00f59b" />
  <text x="910" y="25" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="700" fill="#00f59b" letter-spacing="1">
    ONLINE
  </text>

  <!-- Main Heading -->
  <text x="50" y="105" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="40" font-weight="800" fill="#eef2f6" letter-spacing="2">
    PAULO ESSAU <tspan fill="#00f59b">//</tspan> PAULOB0T<tspan fill="#00f59b">_</tspan>
  </text>

  <!-- Subtitle / Role -->
  <text x="50" y="140" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="16" font-weight="600" fill="#8b96a8" letter-spacing="1">
    &gt; Full Stack Developer @ <tspan fill="#eef2f6" font-weight="700">WiCode</tspan> | Backend, Concurrencia &amp; Sistemas Linux
  </text>

  <!-- Bottom Technical Tags Strip -->
  <rect x="50" y="156" width="126" height="24" fill="#12161f" stroke="#2b3548" stroke-width="1.5" />
  <text x="113" y="172" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="700" fill="#00f59b" text-anchor="middle">
    GO / JAVA 21
  </text>

  <rect x="186" y="156" width="150" height="24" fill="#12161f" stroke="#2b3548" stroke-width="1.5" />
  <text x="261" y="172" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="700" fill="#ffb000" text-anchor="middle">
    PYTHON / FASTAPI
  </text>

  <rect x="346" y="156" width="174" height="24" fill="#12161f" stroke="#2b3548" stroke-width="1.5" />
  <text x="433" y="172" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">
    TS / REACT / VUE / NG
  </text>

  <rect x="530" y="156" width="184" height="24" fill="#12161f" stroke="#2b3548" stroke-width="1.5" />
  <text x="622" y="172" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="700" fill="#eef2f6" text-anchor="middle">
    POSTGRES / MARIADB
  </text>

  <!-- Right Pixel Accent Block -->
  <rect x="910" y="75" width="14" height="14" fill="#00f59b" />
  <rect x="928" y="75" width="14" height="14" fill="#00f59b" />
  <rect x="946" y="75" width="14" height="14" fill="#00f59b" />
  <rect x="928" y="93" width="14" height="14" fill="#00f59b" />

  <rect x="892" y="129" width="14" height="14" fill="#ffb000" />
  <rect x="892" y="147" width="14" height="14" fill="#ffb000" />
  <rect x="910" y="147" width="14" height="14" fill="#ffb000" />
  <rect x="928" y="147" width="14" height="14" fill="#ffb000" />
</svg>
